version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: ['minor', 'patch']
      production-patches:
        dependency-type: production
        update-types: ['patch']
    ignore:
      # flydrive 2.x requires Node >=24; this project supports Node >=22 and CI
      # tests against 22. Revisit only when the support floor moves to 24.
      - dependency-name: flydrive
        update-types: ['version-update:semver-major']
      # Node types should track the *minimum* supported runtime (22), not the
      # newest release, so we don't compile against APIs the floor lacks.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # The docs site is not a workspace member and has its own lockfile, so the
  # entry above does not see it. Without this, Astro/Starlight never get update
  # PRs and quietly rot. Its Node floor (>=22.12) is why it is separate at all.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      dev-dependencies:
        dependency-type: development
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
