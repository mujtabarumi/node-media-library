name: Docs
on:
  push: { branches: [main], paths: ['website/**', '.github/workflows/docs.yml'] }
  pull_request: { paths: ['website/**', '.github/workflows/docs.yml'] }
permissions:
  contents: read
concurrency:
  group: 'docs-${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: website }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # Node 22, not the library's 20/22 matrix: Astro requires >=22.12, which is
      # why the site is not a pnpm workspace member. See website/README.md.
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      # No --ignore-workspace needed: website/pnpm-workspace.yaml declares this
      # directory its own workspace root, so a bare install resolves against
      # website/pnpm-lock.yaml. Keeping the flag off here is deliberate — it
      # means CI exercises the same command Cloudflare Pages runs.
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
