name: Docs
on:
  push: { branches: [main], paths: ['website/**', '.github/workflows/docs.yml'] }
  pull_request: { paths: ['website/**', '.github/workflows/docs.yml'] }
permissions:
  contents: read
concurrency:
  group: 'docs-${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: website }
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      # Node 22, not the library's 20/22 matrix: Astro requires >=22.12, which is
      # why the site is not a pnpm workspace member. See website/README.md.
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      # --ignore-workspace because website/ is intentionally outside the
      # workspace and resolves against its own lockfile.
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - run: pnpm check
      - run: pnpm build
