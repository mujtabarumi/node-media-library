name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: 'ci-${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { node: [22] }
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
      rabbitmq:
        image: rabbitmq:4
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils ffmpeg jpegoptim pngquant
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: '${{ matrix.node }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm -r typecheck
      - run: pnpm -r build
      - run: pnpm -r test
        env:
          REDIS_URL: 'redis://localhost:6379'
          AMQP_URL: 'amqp://guest:guest@localhost:5672'

  # The API reference under website/src/content/docs/api is generated and
  # committed, so Cloudflare can publish the site without installing the
  # library's dependency tree. Committed generated output rots unless
  # something checks it, so: regenerate, and fail on any diff.
  api-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @node-media-library/core docs:api
      - name: API reference is up to date
        run: |
          if ! git diff --quiet -- website/src/content/docs/api; then
            echo "::error::The committed API reference is stale. Run: pnpm --filter @node-media-library/core docs:api"
            git diff --stat -- website/src/content/docs/api
            exit 1
          fi
